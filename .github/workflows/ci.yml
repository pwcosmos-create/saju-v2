name: CI & Saju Knowledge & Security Audit

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knowledge-cards-verification:
    # cards.live.json 은 gitignore(서버 sync). CI는 expand 시드 무결성만 검증.
    name: Saju Knowledge Expand Pack Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify expand script seeds and fills cards
        run: |
          rm -f core/data/cards.live.json
          node scripts/expand-knowledge-cards.mjs
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('core/data/cards.live.json', 'utf8'));
            const cards = data.cards || [];
            const count = cards.length;
            console.log('Verified expand-seed cards count:', count);
            if (count < 70) {
              console.error('Error: Expand pack too small. Expected at least 70, found:', count);
              process.exit(1);
            }
            const missing = cards.filter((c) => !c.title || !c.body);
            if (missing.length) {
              console.error('Error: Cards missing title/body:', missing.length);
              process.exit(1);
            }
            console.log('All expand-seed saju knowledge cards passed integrity check.');
          "

  lint-and-typecheck:
    name: TypeCheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        # apps-in-toss peer optional deps make npm ci flaky vs lockfile
        run: npm install --no-audit --no-fund

      - name: TypeCheck (tsc)
        run: npm run lint

  build:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    needs: [knowledge-cards-verification, lint-and-typecheck]
    env:
      SYNC_CARDS_SKIP: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Next.js Build
        run: npm run build

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Production Security Audit
        run: npm audit --omit=dev --audit-level=critical || true
